[General]
; Show ward power meter on HUD while casting a ward spell.
; Default: 1
bShowWardMeter=1

; If true, perk requirements only apply to player; NPCs get features automatically.
; Default: 0
bPerkGatesPlayerOnly=0

[Tweaks]
; Wards charge instantly to full power.
; Ignores fChargeRateMultiplier.
; Default: 0
bInstantCharge=0

; Ward charge speed multiplier.
; Only applies when bInstantCharge is false.
; Valid range: 0.01-10.0.
; Default: 1.0
fChargeRateMultiplier=1.0

; Ward strength multiplier (max ward power).
; Valid range: 0.01-10.0.
; Default: 1.0
fMagnitudeMultiplier=1.0

; Ward magicka cost multiplier.
; Valid range: 0.01-10.0.
; Default: 1.0
fCostMultiplier=1.0

; If true, tweaks only apply to player and teammates.
; Default: 0
bRestrictToPlayerTeam=0

[Physical]
; If true, attackers will stagger when their normal (non-power) melee attack is blocked by a ward.
; Default: 0
bStaggerNormalAttacks=0

; Stagger magnitude applied when a normal attack is blocked by a ward.
; Valid range: 0.1-1.0.
; Default: 0.3
fStaggerMagnitude=0.3

; If true, attackers recoil when their power melee attack is blocked by a ward.
; Default: 1
bStaggerPowerAttacks=1

; Blocking cone angle for melee and ranged attacks. Spells use their own hit detection.
; Valid range: 45.0-180.0.
; Default: 90.0
fBlockingAngle=90.0

; Multiplier applied to physical damage before subtracting from ward power.
; Set to 0 to prevent physical hits from draining ward power.
; Valid range: 0.0-10.0.
; Default: 1.0
fPowerDamageMultiplier=1.0

; Multiplier for Restoration XP gained when blocking with a ward.
; Valid range: 0.1-10.0.
; Default: 0.25
fBlockXPScale=0.25

; Perks required for physical blocking (plugin|formID,...).
; Empty = always enabled.
; Default: empty
sPhysicalRequiredPerks=

[Magic.Shouts]
; 0 = Vanilla, 1 = BreakOnly, 2 = Break+Stagger, 3 = Break+PassThrough
; Controls the overall ward vs shout behavior. Other shout values act as tuning knobs.
; Valid range: 0-3.
; Default: 3
iShoutMode=3

; If true, player wards behave like vanilla (absorb shouts completely).
; Default: 0
bPlayerImmuneToShoutMechanics=0

; Flat ward power damage from shouts.
; Only used when bShoutInstantBreak is false.
; Valid range: 0.0-250.0.
; Default: 40.0
fShoutDamage=40.0

; If true, shouts instantly break wards instead of dealing fixed damage.
; Ignored in Vanilla mode.
; Default: 0
bShoutInstantBreak=0

; Stagger magnitude applied when the ward breaks from a shout in Break+Stagger mode.
; Valid range: 0.1-1.0.
; Default: 0.3
fStaggerMagnitudeTowardDefender=0.3

; Keywords treated as damaging for ward/shout logic.
; Default: vanilla magic damage keywords
sDamageKeywords=MagicDamageFire|MagicDamageFrost|MagicDamageShock|MagicDamageStamina|MagicDamageMagicka|MagicDamageHealth|MagicDamageDrain|MagicDamagePoison

; Perks required for shout mechanics (plugin|formID,...).
; Empty = always enabled.
; Default: empty
sShoutsRequiredPerks=

[Magic.Effects]
; If true, wards can block disease spells when facing the source.
; Default: 1
bBlockDiseases=1

; If true, wards can block hostile cloak spell ticks when facing the source.
; Default: 1
bBlockCloaks=1

; Multiplier applied to cloak effect magnitude when calculating ward power drain.
; Set to 0 to block cloak ticks without draining ward power.
; Valid range: 0.0-10.0.
; Default: 1.0
fCloakDamageMultiplier=1.0

; Extra spells to treat as diseases. Format: plugin|formID,...
; Default: empty
sDiseaseSpells=

; Extra spells to treat as cloaks. Format: plugin|formID,...
; Default: empty
sCloakSpells=

; Perks required for disease blocking (plugin|formID,...).
; Empty = always enabled.
; Default: empty
sDiseaseRequiredPerks=

; Perks required for cloak blocking (plugin|formID,...).
; Empty = always enabled.
; Default: empty
sCloakRequiredPerks=

[Magic.Reflection]
; If true, wards reflect incoming projectile spells back toward the attacker.
; Default: 1
bEnableSpellReflection=1

; If true, reflected spells aim at the attacker. If false, spells reflect forward.
; Default: 1
bAutoAimReflection=1

; If true, the original attacker is blamed for reflected spell damage.
; Default: 1
bReflectionBlameAttacker=1

; Spawn offset for reflected projectiles.
; Valid range: 16.0-256.0.
; Default: 48.0
fReflectionForwardOffset=48.0

; If true, spells are reflected even when they break the ward.
; Default: 1
bReflectEvenIfWardBroken=1

; If true, only player and follower wards reflect spells.
; Default: 0
bRestrictReflectionToPlayerTeam=0

; Perks required for reflection (plugin|formID,...).
; Empty = always enabled.
; Default: empty
sReflectionRequiredPerks=

[Exclusions]
; Ward-casting items that should disable PerfectlyValidWards features.
; Format: plugin|formID,plugin|formID
; Example: Skyrim.esm|0x045F96 (Spellbreaker)
; Default: empty
sExcludedItems=

; If true, excluded ward items disable physical ward mechanics.
; Default: 1
bExcludedItemsDisablePhysicalBlocking=1

; If true, excluded ward items disable shout vs ward mechanics.
; Default: 1
bExcludedItemsDisableShoutMechanics=1

; If true, excluded ward items disable disease blocking.
; Default: 1
bExcludedItemsDisableDiseaseBlocking=1

; If true, excluded ward items disable cloak blocking.
; Default: 1
bExcludedItemsDisableCloakBlocking=1

; If true, excluded ward items disable spell reflection.
; Default: 1
bExcludedItemsDisableReflection=1

; Shouts excluded from ward mechanics. Word spells are excluded automatically.
; Format: plugin|formID,...
; Default: Skyrim.esm|0xE5F68
sShoutExclusions=Skyrim.esm|0xE5F68

; Spells excluded from reflection (plugin|formID,...)
; Default: empty
sReflectionExclusions=
